name: Build Akachi Account Guard

on:
  workflow_dispatch:
  push:
    paths:
      - "akachi-auth-mod/**"
      - ".github/workflows/build-akachi-auth-mod.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Forge mod
        working-directory: akachi-auth-mod
        run: chmod +x gradlew && ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: akachi-auth-mod
          path: akachi-auth-mod/build/libs/akachi_auth-*.jar
          if-no-files-found: error
